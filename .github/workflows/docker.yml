name: Game image

# Builds the game runtime image on every change to it, and publishes it to GHCR on version tags
# (v0.1.0 -> ghcr.io/<owner>/spelunky2rl-game:0.1.0). The tag must match spelunky2rl.version.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["docker/**", "src/spelunky2rl/mod/**", "src/spelunky2rl/engine/launchers/config/**"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: meta
        run: |
          version=$(python3 -c "exec(open('src/spelunky2rl/version.py').read()); print(__version__)")
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "tag ${GITHUB_REF#refs/tags/} does not match package version $version" >&2; exit 1
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/spelunky2rl-game:$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: ${{ steps.meta.outputs.image }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
