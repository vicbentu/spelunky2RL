[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spelunky2rl"
version = "0.1.0"
description = "Gymnasium environments for Spelunky 2 reinforcement learning"
readme = "readme.md"
requires-python = ">=3.9"

# Core dependencies - required for basic SpelunkyRL functionality
dependencies = [
    "gymnasium",
    "numpy",
    "pywin32; sys_platform == 'win32'",
    "psutil",
]

# Optional dependencies for specific use cases
[project.optional-dependencies]
# For training RL agents (examples/train_get_to_exit.py)
train = [
    "torch",
    "stable-baselines3",
    "sb3-contrib",
]

# For recording videos (examples/record_video.py)
video = [
    "opencv-python",
]

# Tests and linting
dev = [
    "pytest",
    "ruff",
]

# Install everything
all = [
    "torch",
    "stable-baselines3",
    "sb3-contrib",
    "opencv-python",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spelunky2rl = ["mod/**/*", "tools/*.md", "engine/launchers/config/*.ini"]
[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
